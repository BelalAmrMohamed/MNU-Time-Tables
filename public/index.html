<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />

    <!-- Critical Performance: DNS prefetch and preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>الجدول الدراسي | MNU</title>
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <link rel="shortcut icon" href="assets/favicon.png" type="image/png">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mnu-timetable.vercel.app/">
    <meta property="og:title" content="الجدول الدراسي | MNU: جدول العام الثاني لكلية الحاسبات والذكاء الإصطناعي">
    <meta property="og:description" content="بوابة الجدول الدراسي لطلاب السنة الثانية - جامعة MNU">
    <meta property="og:image" content="https://mnu-timetable.vercel.app/assets/images/thumbnail.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="الجدول الدراسي | MNU">
    <meta property="og:site_name" content="الجدول الدراسي | MNU">
    <meta property="og:locale" content="ar_AR">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#0088cc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: dark)">
    <meta name="description" content="بوابة الجدول الدراسي لطلاب السنة الثانية - جامعة MNU" />
    <meta name="author" content="Belal Amr Mohamed">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <meta name="keywords" content="MNU, الجدول الدراسي, العام الثاني, تعليم, دراسة">
    <link rel="canonical" href="https://mnu-timetable.vercel.app/">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "الجدول الدراسي | MNU",
      "alternateName": "MNU Timetable",
      "description": "بوابة الجدول الدراسي لطلاب السنة الثانية - جامعة MNU",
      "url": "https://mnu-timetable.vercel.app/",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "inLanguage": "ar",
      "author": {
        "@type": "Person",
        "name": "Belal Amr Mohamed",
        "url": "https://portfolio-of-belal.vercel.app/"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "150"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        { 
          "@type": "ListItem", 
          "position": 1, 
          "name": "الجدول الدراسي | MNU", 
          "item": "https://mnu-timetable.vercel.app/" 
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts: Inter (Latin) + Tajawal (Arabic) — optimized loading -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'; this.onload=null;">
    <noscript>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
            rel="stylesheet">
    </noscript>

    <link rel="preload" href="src/css/style.css" as="style">
    <link rel="preload" href="src/css/wizard.css" as="style">
    <link rel="preload" href="src/css/timetable.css" as="style">

    <link rel="stylesheet" href="src/css/style.css" />
    <link rel="stylesheet" href="src/css/wizard.css" />
    <link rel="stylesheet" href="src/css/timetable.css" />

    <!-- Security: Content Security Policy (recommended) But it may prevent the Downloading libraries like pptx and pdf -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; 
                   script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; 
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
                   font-src 'self' https://fonts.gstatic.com; 
                   img-src 'self' data: https:; 
                   connect-src 'self';">

</head>

<body>
    <!-- Ambient Background Blobs -->
    <div class="bg-blobs" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <h1 class="logo">📅 الجدول الدراسي</h1>
                <p class="subtitle">الفصل الدراسي الثاني — السنة الثانية</p>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content">
            <!-- Step 1: Group Selection -->
            <section id="step-group" class="wizard-step active">
                <div class="step-card">
                    <div class="step-indicator">
                        <span class="step-number active">١</span>
                        <span class="step-line"></span>
                        <span class="step-number">٢</span>
                    </div>
                    <h2 class="step-title">اختر المجموعة</h2>
                    <p class="step-desc">اختر المجموعة الخاصة بك لعرض جدول المحاضرات</p>
                    <div id="group-buttons" class="selection-grid group-grid">
                        <!-- Filled by JS -->
                    </div>
                </div>
            </section>

            <!-- Step 2: Section Selection -->
            <section id="step-section" class="wizard-step">
                <div class="step-card">
                    <div class="step-indicator">
                        <span class="step-number done">✓</span>
                        <span class="step-line active-line"></span>
                        <span class="step-number active">٢</span>
                    </div>
                    <h2 class="step-title">اختر الشعبة</h2>
                    <p class="step-desc">اختر الشعبة الخاصة بك لعرض جدول السكاشن</p>
                    <div id="section-buttons" class="selection-grid section-grid">
                        <!-- Filled by JS -->
                    </div>
                    <button id="back-to-group" class="back-btn" aria-label="العودة لاختيار المجموعة">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M7.5 15L12.5 10L7.5 5" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        العودة
                    </button>
                    <!-- d="M7.5 15L12.5 10L7.5 5" -->
                </div>
            </section>

            <!-- Step 3: Timetable Display -->
            <section id="step-timetable" class="wizard-step">
                <div class="timetable-header">
                    <div class="timetable-info">
                        <h2 class="step-title">جدولك الدراسي</h2>
                        <p id="selection-summary" class="selection-summary"></p>
                    </div>
                    <div class="timetable-actions">
                        <button id="download-pdf" class="action-btn pdf-btn" aria-label="تحميل PDF">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                                <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            تحميل PDF
                        </button>
                        <button onclick="window.print()" class="action-btn pdf-btn" aria-label="تحميل PDF">
                            اطبع الصفحة
                        </button>
                        <button id="back-to-section" class="back-btn" aria-label="العودة لاختيار الشعبة">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M7.5 15L12.5 10L7.5 5" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            تغيير الاختيار
                        </button>
                    </div>
                </div>
                <div id="timetable-container" class="timetable-container">
                    <!-- Filled by JS -->
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>جدول الفصل الدراسي الثاني — ٢٠٢٥-٢٠٢٦</p>
        </footer>
    </div>

    <!-- App Scripts (PDF libraries are loaded lazily by export.js) -->
    <script src="src/js/state.js"></script>
    <script src="src/js/dom.js"></script>
    <script src="src/js/export.js"></script>
    <script src="src/js/app.js"></script>
</body>

</html>
